<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A202C"/>
      <stop offset="50%" stop-color="#2D3748"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E05E"/>
      <stop offset="50%" stop-color="#ECC94B"/>
      <stop offset="100%" stop-color="#B7791F"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" rx="18" fill="url(#goldGrad)" stroke="url(#goldShine)" stroke-width="2"/>
  
  <!-- Subtle geometric luxury lines -->
  <circle cx="200" cy="125" r="140" stroke="url(#goldShine)" stroke-width="1" opacity="0.15"/>
  <circle cx="200" cy="125" r="100" stroke="url(#goldShine)" stroke-width="1" opacity="0.1"/>

  <text x="28" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Vietin<tspan fill="#ECC94B">Bank</tspan></text>
  <text x="28" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="url(#goldShine)" letter-spacing="2">PREMIUM BANKING</text>

  <!-- Crown / Diamond Emblem -->
  <g transform="translate(320, 26)">
    <polygon points="20,5 35,15 30,35 10,35 5,15" fill="none" stroke="url(#goldShine)" stroke-width="2"/>
    <circle cx="20" cy="20" r="4" fill="url(#goldShine)"/>
  </g>

  <!-- Card chip -->
  <rect x="28" y="85" width="40" height="30" rx="6" fill="url(#goldShine)"/>

  <text x="28" y="170" font-family="'Space Grotesk', monospace" font-size="18" font-weight="600" fill="url(#goldShine)" letter-spacing="4">4869  ••••  ••••  9999</text>
  <text x="28" y="215" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">VIETINBANK PRIORITY MEMBER</text>
  
  <rect x="270" y="195" width="105" height="30" rx="15" fill="#ECC94B" fill-opacity="0.15" stroke="url(#goldShine)" stroke-width="1"/>
  <text x="322" y="215" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#ECC94B" text-anchor="middle">VIP PRIVILEGE</text>
</svg>
