<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002D5A"/>
      <stop offset="60%" stop-color="#004890"/>
      <stop offset="100%" stop-color="#006BB3"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ED1C24"/>
      <stop offset="100%" stop-color="#FF5A60"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#heroGrad)"/>

  <!-- Decorative geometric banking waves -->
  <circle cx="1100" cy="80" r="300" fill="#009FE3" opacity="0.12"/>
  <circle cx="1000" cy="350" r="220" fill="#ED1C24" opacity="0.1"/>
  <path d="M 0,340 C 300,280 600,420 900,320 L 1200,380 L 1200,400 L 0,400 Z" fill="#FFFFFF" opacity="0.04"/>

  <!-- Hero Content Left -->
  <g transform="translate(60, 80)">
    <!-- Badge -->
    <rect width="210" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <circle cx="18" cy="17" r="5" fill="#4ADE80"/>
    <text x="32" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Kiosk Quầy Giao Dịch Số</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-1">VIETINBANK ĐỒNG HÀNH</text>
    <text x="0" y="135" font-family="'Plus Jakarta Sans', sans-serif" font-size="40" font-weight="800" fill="#38BDF8">NÂNG GIÁ TRỊ CUỘC SỐNG</text>
    <text x="0" y="175" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="500" fill="#E2E8F0">Trải nghiệm tương tác thông minh • Tính toán lãi vay & tiền gửi • Minigame nhận quà</text>

    <!-- Stat Pills -->
    <g transform="translate(0, 205)">
      <rect x="0" y="0" width="160" height="54" rx="12" fill="#FFFFFF" fill-opacity="0.1"/>
      <text x="16" y="24" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="800" fill="#F8FAFC">0 VNĐ</text>
      <text x="16" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#93C5FD">Phí dịch vụ trọn đời</text>

      <rect x="175" y="0" width="160" height="54" rx="12" fill="#FFFFFF" fill-opacity="0.1"/>
      <text x="191" y="24" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="800" fill="#F8FAFC">+0.3%/năm</text>
      <text x="191" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#93C5FD">Ưu đãi gửi iPay</text>

      <rect x="350" y="0" width="160" height="54" rx="12" fill="#FFFFFF" fill-opacity="0.1"/>
      <text x="366" y="24" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="800" fill="#F8FAFC">100%</text>
      <text x="366" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#93C5FD">Bảo mật sinh trắc học</text>
    </g>
  </g>
</svg>
